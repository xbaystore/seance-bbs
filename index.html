<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séance BBS — CONNECT 14400</title>
  <meta name="description" content="A 1990s dial-up BBS, resurrected as a modern web app. The board is dead. Long live the board.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="crt">
    <header class="status-line" aria-label="Terminal status">
      <span class="status-brand">SÉANCE BBS</span>
      <span class="status-node">NODE 1 · 555-0199</span>
    </header>

    <main id="screen" class="terminal" aria-label="BBS terminal">
      <div id="transcript" class="transcript" role="log" aria-live="polite"></div>
      <p class="cursor-line" aria-hidden="true"><span class="cursor">█</span></p>
    </main>

    <footer class="footer-line">
      <span>EST. 1994 · STILL ANSWERING</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
